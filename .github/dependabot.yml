version: 2
updates:
  # Using dependabot for all GHA violates pinning policy
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      # Check for new versions weekly
      interval: weekly
    # Update all actions in a single PR
    groups:
      github-actions:
        patterns: ["*"]
    labels:
      - automation
      - gha-update
    # Only update approved action names, including the GoReleaser exception.
    # This list does not approve individual action versions or commit SHAs.
    allow:
      - dependency-name: "actions/*"
      - dependency-name: "github-actions/*"
      - dependency-name: "goreleaser/goreleaser-action"

  # Follow CAPI/CAPO: group routine Go updates, but review related Kubernetes,
  # controller-runtime, CAPI and CAPO version changes together.
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    groups:
      go-patch-and-minor:
        patterns: ["*"]
        update-types: ["patch", "minor"]
    ignore:
      - dependency-name: "k8s.io/*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "sigs.k8s.io/controller-runtime"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "sigs.k8s.io/cluster-api*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    labels:
      - automation
      - go-update
    commit-message:
      prefix: go

  # The Go builder version comes from go.mod through Makefile. Only image
  # references with their own version (such as the runtime image) are updated here.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - automation
      - image-update
