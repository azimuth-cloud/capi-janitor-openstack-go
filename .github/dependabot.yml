version: 2
updates:
  # Using dependabot for all GHA violates pinning policy
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      # Check for new versions weekly
      interval: weekly
    # Update all actions in a single PR
    groups:
      github-actions:
        patterns: ["*"]
    labels:
      - automation
      - gha-update
    # Only allow updates for actions maintained by GitHub
    allow:
      - dependency-name: "actions/*"
      - dependency-name: "github-actions/*"
      - dependency-name: "goreleaser/goreleaser-action"

  # NOTE: gomod updates are deliberately not enabled. The Nix build pins
  # `vendorHash` in nix/default.nix, which must be recomputed by hand for every
  # dependency change, so Dependabot Go PRs always fail CI.
