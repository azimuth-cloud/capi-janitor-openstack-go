name: Publish artifacts

on:
  # Publish development artifacts from main and releases from SemVer tags.
  push:
    branches:
      - main
    tags:
      - 'v*'
  # Also allow publication to be done via a workflow call
  # In this case, the chart version is returned as an output
  workflow_call:
    inputs:
      ref:
        type: string
        description: The ref to build.
        required: true
    outputs:
      chart-version:
        description: The chart version that was published
        value: ${{ jobs.build_push_chart.outputs.chart-version }}

permissions: {}

env:
  GOTOOLCHAIN: local

jobs:
  build_push_images:
    name: Build, scan and push images
    runs-on: ubuntu-latest
    outputs:
      image: ghcr.io/${{ github.repository }}:${{ steps.semver.outputs.short-sha }}
    permissions:
      contents: read
      packages: write # required for pushing container images
      id-token: write # required for the shared action's image signing
      security-events: write # required for publishing Grype SARIF results
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Login to GitHub Container Registry
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get SemVer version for current commit
        id: semver
        uses: azimuth-cloud/github-actions/semver@master

      # Keep the existing branch, release and short-SHA image tags.
      - name: Calculate image tags
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=${{ steps.semver.outputs.short-sha }}

      - name: Read the Go version for the image build
        id: build-config
        run: |
          go_version=$(make --no-print-directory go-version)
          echo "go-version=$go_version" >> "$GITHUB_OUTPUT"

      - name: Build, scan and push images with the shared action
        uses: azimuth-cloud/github-actions/docker-multiarch-build-push@master
        with:
          cache-key: capi-janitor-openstack-go
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: GO_VERSION=${{ steps.build-config.outputs.go-version }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Verify published manifest lists are multi-arch
        env:
          # Inspecting one tag is enough: all tags point at the same manifest.
          TAG: ghcr.io/${{ github.repository }}:${{ steps.semver.outputs.short-sha }}
        run: |
          PLATFORMS=$(docker buildx imagetools inspect --format '{{json .Manifest}}' "$TAG" \
            | jq -r '[.manifests[].platform | select(.os != "unknown" and .architecture != "unknown") | .os + "/" + .architecture] | unique | sort | join(",")')
          echo "$TAG -> $PLATFORMS"
          [[ "$PLATFORMS" == "linux/amd64,linux/arm64" ]]

  smoke_images:
    name: Image smoke test (${{ matrix.arch }})
    needs: [build_push_images]
    # Execute the published images on native runners after the shared scan passes.
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runs-on: ubuntu-latest
          - arch: arm64
            runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Login to GitHub Container Registry
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and smoke test the published image
        env:
          IMAGE: ${{ needs.build_push_images.outputs.image }}
          PLATFORM: linux/${{ matrix.arch }}
        run: |
          docker pull --platform "$PLATFORM" "$IMAGE"
          docker run --pull=never --platform "$PLATFORM" --rm --read-only --user 65532:65532 "$IMAGE" --help
          docker run --pull=never --platform "$PLATFORM" --rm --read-only --user 65532:65532 --entrypoint /bin/manager "$IMAGE" --help

      - name: Generate SBOM (CycloneDX)
        env:
          IMAGE: ${{ needs.build_push_images.outputs.image }}
        run: make sbom IMG="$IMAGE" PLATFORM=linux/${{ matrix.arch }} SBOM=sbom-${{ matrix.arch }}.cdx.json

      - name: Upload SBOM as artifact
        uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ matrix.arch }}.cdx.json
          path: sbom-${{ matrix.arch }}.cdx.json

  build_push_chart:
    name: Build and push Helm chart
    runs-on: ubuntu-latest
    # Only publish the chart after the shared scan and both native smoke tests pass.
    needs: [build_push_images, smoke_images]
    outputs:
      chart-version: ${{ steps.artifact-versions.outputs.chart }}
    permissions:
      contents: read
      id-token: write # Required for chart signing
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          # This is important for the semver action to work correctly
          # when determining the number of commits since the last tag
          fetch-depth: 0
          persist-credentials: false

      - name: Get SemVer version for current commit
        id: semver
        uses: azimuth-cloud/github-actions/semver@master

      - name: Select the chart and image versions
        id: artifact-versions
        env:
          BUILD_REF: ${{ inputs.ref || github.ref }}
          SEMVER_VERSION: ${{ steps.semver.outputs.version }}
          SHORT_SHA: ${{ steps.semver.outputs.short-sha }}
        run: |
          if [[ "$BUILD_REF" == refs/tags/* ]]; then
            TAG="${BUILD_REF#refs/tags/}"
            echo "chart=${TAG#v}" >> "$GITHUB_OUTPUT"
            echo "image=$TAG" >> "$GITHUB_OUTPUT"
          else
            # Keep non-tag builds separate from releases, even on a tagged commit.
            echo "chart=${SEMVER_VERSION%%[-+]*}-dev.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
            echo "image=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish Helm chart to Quay
        uses: azimuth-cloud/github-actions/helm-publish-oci@master
        with:
          directory: chart
          registry: quay.io
          repository: azimuth/cluster-api-janitor-openstack-charts
          username: ${{ secrets.QUAY_IO_USER }}
          token: ${{ secrets.QUAY_IO_TOKEN }}
          version: ${{ steps.artifact-versions.outputs.chart }}
          app-version: ${{ steps.artifact-versions.outputs.image }}

      - name: Publish Artifact Hub metadata
        uses: azimuth-cloud/github-actions/artifacthub-metadata@master
        with:
          directory: chart
          registry: quay.io
          repository: azimuth/cluster-api-janitor-openstack-charts
          username: ${{ secrets.QUAY_IO_USER }}
          token: ${{ secrets.QUAY_IO_TOKEN }}

  publish_github_release:
    name: Publish GitHub release
    if: startsWith(inputs.ref || github.ref, 'refs/tags/')
    needs:
      - build_push_images
      - smoke_images
      - build_push_chart
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build binaries and create the draft release
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the completed GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REF: ${{ inputs.ref || github.ref }}
        run: |
          TAG="${RELEASE_REF#refs/tags/}"
          gh release edit "$TAG" --draft=false
