name: Publish artifacts

on:
  # Publish development artifacts from main and releases from SemVer tags.
  push:
    branches:
      - main
    tags:
      - 'v*'
  # Also allow publication to be done via a workflow call
  # In this case, the chart version is returned as an output
  workflow_call:
    inputs:
      ref:
        type: string
        description: The ref to build.
        required: true
    outputs:
      chart-version:
        description: The chart version that was published
        value: ${{ jobs.build_push_chart.outputs.chart-version }}

permissions: {}

jobs:
  build_push_images:
    name: Build and push image (${{ matrix.arch }})
    # Each arch builds on its own native runner so the resulting binary can be
    # executed for a real smoke test.
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runs-on: ubuntu-latest
            nix-image: image
            nix-sbom: sbom
          - arch: arm64
            runs-on: ubuntu-24.04-arm
            nix-image: image-arm64
            nix-sbom: sbom-arm64
    permissions:
      contents: read
      packages: write # required for pushing container images
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@07ebb8d2749aa2fac2baae7d1cfa011e4acfd8d1 # v5

      - name: Login to GitHub Container Registry
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get SemVer version for current commit
        id: semver
        uses: azimuth-cloud/github-actions/semver@master

      - name: Build image
        run: nix-build nix -A ${{ matrix.nix-image }} -o image.tar.gz

      # Not guaranteed to be present on the runner image.
      - name: Install skopeo
        run: |
          nix-build nix/nixpkgs.nix -A skopeo -o skopeo
          echo "$PWD/skopeo/bin" >> "$GITHUB_PATH"

      # Load the image and run the manager on its native runner.
      - name: Smoke test the image
        run: docker run --rm "$(docker load -q -i image.tar.gz | awk '{print $NF}')" --help

      - name: Push arch-specific image
        env:
          # Per-arch tag consumed by the manifest-list job.
          DEST: ghcr.io/${{ github.repository }}:${{ steps.semver.outputs.short-sha }}-${{ matrix.arch }}
        run: skopeo copy docker-archive:image.tar.gz "docker://${DEST}"

      - name: Generate SBOM (CycloneDX)
        run: nix-build nix -A ${{ matrix.nix-sbom }} -o sbom-${{ matrix.arch }}.cdx.json

      - name: Upload SBOM as artifact
        uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ steps.semver.outputs.short-sha }}-${{ matrix.arch }}
          path: sbom-${{ matrix.arch }}.cdx.json

  push_manifest_list:
    name: Assemble and push multi-arch manifest list
    runs-on: ubuntu-latest
    needs: [build_push_images]
    permissions:
      contents: read
      packages: write # required for pushing the manifest list
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Login to GitHub Container Registry
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get SemVer version for current commit
        id: semver
        uses: azimuth-cloud/github-actions/semver@master

      # Produce the final tags declaratively: branch name, git tag, and short SHA.
      - name: Calculate image tags
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=${{ steps.semver.outputs.short-sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Create and push multi-arch manifest lists
        env:
          SRC: ghcr.io/${{ github.repository }}:${{ steps.semver.outputs.short-sha }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for TAG in $TAGS; do
            docker buildx imagetools create -t "$TAG" \
              "${SRC}-amd64" "${SRC}-arm64"
          done

      - name: Verify published manifest lists are multi-arch
        env:
          # Inspecting one tag is enough: all tags point at the same manifest.
          TAG: ghcr.io/${{ github.repository }}:${{ steps.semver.outputs.short-sha }}
        run: |
          PLATFORMS=$(docker buildx imagetools inspect --format '{{json .Manifest}}' "$TAG" \
            | jq -r '[.manifests[].platform | .os + "/" + .architecture] | sort | join(",")')
          echo "$TAG -> $PLATFORMS"
          [[ "$PLATFORMS" == "linux/amd64,linux/arm64" ]]

  build_push_chart:
    name: Build and push Helm chart
    runs-on: ubuntu-latest
    # Only build and push the chart if the images and manifest list published
    needs: [build_push_images, push_manifest_list]
    outputs:
      chart-version: ${{ steps.artifact-versions.outputs.chart }}
    permissions:
      contents: write
      id-token: none
      packages: none
      security-events: none
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          # This is important for the semver action to work correctly
          # when determining the number of commits since the last tag
          fetch-depth: 0
          persist-credentials: false

      - name: Get SemVer version for current commit
        id: semver
        uses: azimuth-cloud/github-actions/semver@master

      - name: Select the chart and image versions
        id: artifact-versions
        env:
          BUILD_REF: ${{ inputs.ref || github.ref }}
          SEMVER_VERSION: ${{ steps.semver.outputs.version }}
          SHORT_SHA: ${{ steps.semver.outputs.short-sha }}
        run: |
          if [[ "$BUILD_REF" == refs/tags/* ]]; then
            TAG="${BUILD_REF#refs/tags/}"
            echo "chart=${TAG#v}" >> "$GITHUB_OUTPUT"
            echo "image=$TAG" >> "$GITHUB_OUTPUT"
          else
            echo "chart=$SEMVER_VERSION" >> "$GITHUB_OUTPUT"
            echo "image=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish Helm charts
        uses: azimuth-cloud/github-actions/helm-publish@master
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: ${{ steps.artifact-versions.outputs.chart }}
          app-version: ${{ steps.artifact-versions.outputs.image }}

  publish_github_release:
    name: Publish GitHub release
    if: startsWith(inputs.ref || github.ref, 'refs/tags/')
    needs:
      - build_push_images
      - push_manifest_list
      - build_push_chart
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build binaries and create the draft release
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the completed GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REF: ${{ inputs.ref || github.ref }}
        run: |
          TAG="${RELEASE_REF#refs/tags/}"
          gh release edit "$TAG" --draft=false
