name: Publish artifacts

on:
  # Publish development artifacts from main and releases from SemVer tags.
  push:
    branches:
      - main
    tags:
      - "v*"
  # Also allow publication to be done via a workflow call
  # In this case, the chart version is returned as an output
  workflow_call:
    inputs:
      ref:
        type: string
        description: The ref to build.
        required: true
    outputs:
      chart-version:
        description: The chart version that was published
        value: ${{ jobs.build_push_chart.outputs.chart-version }}

permissions: {}

jobs:
  build_push_images:
    name: Build and push images (Nix)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write         # required for pushing container images
    steps:
      - name: Check out the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@07ebb8d2749aa2fac2baae7d1cfa011e4acfd8d1 # v5

      - name: Login to GitHub Container Registry
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get SemVer version for current commit
        id: semver
        uses: azimuth-cloud/github-actions/semver@master

      - name: Compute image tags
        id: tags
        env:
          BUILD_REF: ${{ inputs.ref || github.ref }}
        run: |
          # All final tags for the manifest list (space-separated)
          TAGS=""
          REF="$BUILD_REF"
          SHA="${{ steps.semver.outputs.short-sha }}"
          IMAGE="ghcr.io/azimuth-cloud/capi-janitor-openstack-go"
          if [[ "$REF" == refs/tags/* ]]; then
            TAG="${REF#refs/tags/}"
            SEMVER_TAG_RE='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*)|([0-9]*[A-Za-z-][0-9A-Za-z-]*))(\.((0|[1-9][0-9]*)|([0-9]*[A-Za-z-][0-9A-Za-z-]*)))*)?$'
            if (( ${#TAG} > 128 )) || [[ ! "$TAG" =~ $SEMVER_TAG_RE ]]; then
              echo "Release tag must be OCI-compatible SemVer: vMAJOR.MINOR.PATCH[-PRERELEASE]" >&2
              exit 1
            fi
            TAGS="$IMAGE:$TAG $IMAGE:$SHA"
          elif [[ "$REF" == refs/heads/* ]]; then
            BRANCH="${REF#refs/heads/}"
            TAGS="$IMAGE:$BRANCH $IMAGE:$SHA"
          else
            TAGS="$IMAGE:$SHA"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "sha_tag=$IMAGE:$SHA" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Build amd64 image
        run: nix-build nix -A image -o image-amd64.tar.gz

      - name: Build arm64 image (cross-compiled)
        run: nix-build nix -A image-arm64 -o image-arm64.tar.gz

      - name: Push arch-specific images and create manifest list
        env:
          SHA_TAG: ${{ steps.tags.outputs.sha_tag }}
          IMAGE:   ${{ steps.tags.outputs.image }}
          TAGS:    ${{ steps.tags.outputs.tags }}
        run: |
          # Push each arch image under a unique tag used only to assemble the manifest.
          skopeo copy \
            docker-archive:image-amd64.tar.gz \
            "docker://${SHA_TAG}-amd64"
          skopeo copy \
            docker-archive:image-arm64.tar.gz \
            "docker://${SHA_TAG}-arm64"

          # For each final tag, create and push a multi-arch manifest list.
          for TAG in $TAGS; do
            docker manifest create "$TAG" \
              --amend "${SHA_TAG}-amd64" \
              --amend "${SHA_TAG}-arm64"
            docker manifest push "$TAG"
          done

      - name: Generate SBOM (CycloneDX)
        run: nix-build nix -A sbom -o sbom.cdx.json

      - name: Upload SBOM as artifact
        uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ steps.semver.outputs.short-sha }}
          path: sbom.cdx.json

  build_push_chart:
    name: Build and push Helm chart
    runs-on: ubuntu-latest
    # Only build and push the chart if the images built successfully
    needs: [build_push_images]
    outputs:
      chart-version: ${{ steps.artifact-versions.outputs.chart }}
    permissions:
      contents: write
      id-token: none
      packages: none
      security-events: none
    steps:
      - name: Check out the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref }}
          # This is important for the semver action to work correctly
          # when determining the number of commits since the last tag
          fetch-depth: 0
          persist-credentials: false

      - name: Get SemVer version for current commit
        id: semver
        uses: azimuth-cloud/github-actions/semver@master

      - name: Select the chart and image versions
        id: artifact-versions
        env:
          BUILD_REF: ${{ inputs.ref || github.ref }}
          SEMVER_VERSION: ${{ steps.semver.outputs.version }}
          SHORT_SHA: ${{ steps.semver.outputs.short-sha }}
        run: |
          if [[ "$BUILD_REF" == refs/tags/* ]]; then
            TAG="${BUILD_REF#refs/tags/}"
            echo "chart=${TAG#v}" >> "$GITHUB_OUTPUT"
            echo "image=$TAG" >> "$GITHUB_OUTPUT"
          else
            echo "chart=$SEMVER_VERSION" >> "$GITHUB_OUTPUT"
            echo "image=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish Helm charts
        uses: azimuth-cloud/github-actions/helm-publish@master
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: ${{ steps.artifact-versions.outputs.chart }}
          app-version: ${{ steps.artifact-versions.outputs.image }}

  publish_github_release:
    name: Publish GitHub release
    if: startsWith(inputs.ref || github.ref, 'refs/tags/')
    needs:
      - build_push_images
      - build_push_chart
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build binaries and create the draft release
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the completed GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REF: ${{ inputs.ref || github.ref }}
        run: |
          TAG="${RELEASE_REF#refs/tags/}"
          gh release edit "$TAG" --draft=false
