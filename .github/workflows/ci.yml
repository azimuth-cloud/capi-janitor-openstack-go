name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  GOTOOLCHAIN: local

jobs:
  integration-helpers:
    name: Azimuth test helpers (offline)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test acceptance checks without a cloud
        run: |
          python3 -m venv "$RUNNER_TEMP/janitor-tests"
          source "$RUNNER_TEMP/janitor-tests/bin/activate"
          pip install -r test/integration/requirements.txt
          python -m unittest discover -s test/integration -v

  unit:
    # Keep the required status-check name until the branch ruleset is updated.
    name: fmt + vet + test (Nix)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Check build configuration, formatting, vet and unit tests
        run: make check-build-config fmt-check vet test-unit

  envtest:
    name: Controller API integration tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Run controller integration tests
        run: make test-envtest

  arm-image:
    name: ARM64 image smoke test
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Build ARM64 image
        run: make docker-build IMG=controller:ci-arm64 PLATFORM=linux/arm64

      - name: Run ARM64 image
        run: |
          docker run --rm --read-only --user 65532:65532 controller:ci-arm64 --help
          docker run --rm --read-only --user 65532:65532 --entrypoint /bin/manager controller:ci-arm64 --help

  goreleaser:
    name: GoReleaser snapshot
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Build release snapshot
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --snapshot --clean

  helm:
    name: Helm lint + template tests
    permissions:
      contents: read
    uses: ./.github/workflows/helm-lint.yaml
    with:
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
