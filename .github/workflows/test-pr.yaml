name: Integration tests

on:
  # We use pull_request_target so that dependabot-created workflows can run
  pull_request_target:
    types:
      - opened
      - synchronize
      - ready_for_review
      - reopened
    branches:
      - main

# Use the head ref for workflow concurrency, with cancellation
# This should mean that any previous workflows for a PR get cancelled when a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

permissions: {}

#####
# The easiest way to set up a management cluster, make sure all the required images are
# present and have an easy way to create Cluster API clusters using the janitor is to
# leverage the existing Azimuth test infrastructure
#
# TODO(mkjpryor): Change this in the future to use the CAPI management only variation
#####
jobs:
  # Detect which parts of the PR changed, to decide whether the (expensive)
  # Azimuth integration test job needs to run.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      integration: ${{ steps.filter.outputs.integration }}
    steps:
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          filters: |
            integration:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'Makefile'
              - 'nix/**'
              - 'config/**'
              - 'chart/**'
              - '.github/workflows/build-push-artifacts.yaml'
              - '.github/workflows/test-pr.yaml'

  # Privileged integration tests are limited to branches in this repository.
  # Forks still receive the unprivileged lint and unit-test workflows.
  source:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      internal: ${{ steps.check.outputs.internal }}
    steps:
      - name: Check whether the PR branch belongs to this repository
        id: check
        env:
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [[ "$HEAD_REPOSITORY" == "azimuth-cloud/capi-janitor-openstack-go" ]]; then
            echo "internal=true" >> "$GITHUB_OUTPUT"
          else
            echo "internal=false" >> "$GITHUB_OUTPUT"
          fi

  publish_artifacts:
    needs: [changes, source]
    if: needs.changes.outputs.integration == 'true' && needs.source.outputs.internal == 'true'
    uses: ./.github/workflows/build-push-artifacts.yaml
    with:
      ref: ${{ github.event.pull_request.head.sha }}
    permissions:
      contents: write
      packages: write         # required for pushing container images

  run_azimuth_tests:
    needs: [publish_artifacts]
    runs-on: ubuntu-latest
    steps:
      # Check out the configuration repository
      - name: Set up Azimuth environment
        uses: azimuth-cloud/azimuth-config/.github/actions/setup@devel
        with:
          os-clouds: ${{ secrets.OS_CLOUDS }}
          environment-prefix: janitor-ci
          target-cloud: ${{ vars.TARGET_CLOUD }}
          # Use the version of the chart that we just built
          # We also don't need all the tests
          # The Kubernetes test is sufficient to confirm the janitor is working
          extra-vars: |
            clusterapi_janitor_openstack_chart_repo: https://azimuth-cloud.github.io/capi-janitor-openstack-go
            clusterapi_janitor_openstack_chart_version: ${{ needs.publish_artifacts.outputs.chart-version }}
            generate_tests_caas_suite_enabled: false
            generate_tests_kubernetes_apps_suite_enabled: false
        # GitHub terminates jobs after 6 hours
        # We don't want jobs to acquire the lock then get timed out before they can finish
        # So wait a maximum of 3 hours to acquire the lock, leaving 3 hours for other tasks in the job
        timeout-minutes: 180

      # Provision Azimuth using the azimuth-ops version under test
      - name: Provision Azimuth
        uses: azimuth-cloud/azimuth-config/.github/actions/provision@devel

      # Run the tests
      - name: Run Azimuth tests
        uses: azimuth-cloud/azimuth-config/.github/actions/test@devel

      # Tear down the environment
      - name: Destroy Azimuth
        uses: azimuth-cloud/azimuth-config/.github/actions/destroy@devel
        if: ${{ always() }}
